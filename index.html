<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Itinerary</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#faf9fd">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Itinerary">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..700&display=swap" rel="stylesheet">
<style>
/* ===== Design tokens (Material 3) ===== */
:root{color-scheme:light only;
  /* color roles — seed #3d5ba9 */
  --primary:#3d5ba9; --on-primary:#fff; --primary-container:#dae2ff; --on-primary-container:#0e2c69;
  --secondary-container:#dde2f9; --on-secondary-container:#151b2c;
  --tertiary:#8a4f00; --tertiary-container:#ffdcbe; --on-tertiary-container:#2c1600;
  --surface:#faf9fd; --surface-low:#f3f3f8; --surface-c:#edeef3; --surface-high:#e7e8ed; --surface-highest:#e2e2e7;
  --on-surface:#1a1b20; --on-surface-v:#44464f; --outline:#757780; --outline-v:#c5c6d0;
  --green:#1e6b3a; --green-container:#c8f0cf;
  /* region accents (container / on-container) */
  --r1:#d6e8ff; --r1o:#0b3a63; --r2:#cdeccf; --r2o:#0f4a20; --r3:#c9eeea; --r3o:#00433f; --r4:#ffdbcf; --r4o:#6b2610; --r5:#eadcff; --r5o:#3c1f73; --r6:#e3e3e8; --r6o:#44464f;
  /* spacing (8pt grid) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  /* shape */
  --rs:8px; --rm:12px; --rl:16px; --rxl:28px;
  --font:"Google Sans Flex","Google Sans",Roboto,-apple-system,"Segoe UI",sans-serif;
}

/* ===== Type scale ===== */
.display-s{font-size:36px;line-height:44px;font-weight:500;letter-spacing:-.25px}
.headline-s{font-size:24px;line-height:32px;font-weight:500}
.title-l{font-size:22px;line-height:28px;font-weight:500}
.title-m{font-size:16px;line-height:24px;font-weight:600;letter-spacing:.1px}
.title-s{font-size:14px;line-height:20px;font-weight:600;letter-spacing:.1px}
.body-l{font-size:16px;line-height:24px}
.body-m{font-size:14px;line-height:20px;letter-spacing:.15px}
.label-l{font-size:14px;line-height:20px;font-weight:600;letter-spacing:.1px}
.label-m{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.4px}
.v{color:var(--on-surface-v)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--surface);color:var(--on-surface);font:16px/24px var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== Top app bar ===== */
header{position:sticky;top:0;z-index:20;background:var(--surface);padding:calc(env(safe-area-inset-top) + var(--s2)) var(--s4) var(--s2);transition:background .2s}
header.line{background:var(--surface)}
.bar{display:flex;align-items:center;gap:var(--s1);max-width:600px;margin:0 auto;min-height:48px}
.sync{flex:1;display:flex;align-items:center;gap:var(--s2);font-size:14px;color:var(--on-surface-v)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.sync i.off{background:var(--tertiary)}
.ib{width:48px;height:48px;border-radius:50%;border:0;background:transparent;color:var(--on-surface-v);display:grid;place-items:center}
.ib:active{background:var(--surface-high)}
.ib svg{width:24px;height:24px}
.ib.spin svg{animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#searchWrap{display:none;max-width:600px;margin:var(--s2) auto 0}
#search{width:100%;border:0;border-radius:var(--rxl);height:56px;padding:0 var(--s5);font:16px var(--font);background:var(--surface-high);color:var(--on-surface);outline:none}

main{padding:0 var(--s4) calc(env(safe-area-inset-bottom) + 104px);max-width:600px;margin:0 auto}

/* ===== Navigation bar ===== */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface-c);display:flex;justify-content:center;padding:var(--s3) var(--s2) calc(env(safe-area-inset-bottom) + var(--s3))}
nav .in{display:flex;width:100%;max-width:520px}
nav button{flex:1;background:none;border:0;color:var(--on-surface-v);font-size:12px;font-weight:600;letter-spacing:.4px;display:flex;flex-direction:column;align-items:center;gap:var(--s1);padding:0}
nav .ind{width:64px;height:32px;border-radius:16px;display:grid;place-items:center}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--on-surface)}
nav button.on .ind{background:var(--secondary-container);color:var(--on-secondary-container)}

/* ===== Layout primitives ===== */
.page-title{padding:var(--s2) var(--s1) var(--s4)}
.page-title .sub{margin-top:var(--s1)}
.section{display:flex;justify-content:space-between;align-items:baseline;margin:var(--s6) var(--s1) var(--s3)}
.stack>*+*{margin-top:var(--s2)}
.card{background:var(--surface-low);border-radius:var(--rl);padding:var(--s4)}
.card.flat{padding:0;overflow:hidden}
.card.hero{background:var(--primary-container);color:var(--on-primary-container);padding:var(--s5)}
.card.hero .v{color:var(--on-primary-container);opacity:.8}
.list-item{display:flex;align-items:center;gap:var(--s4);padding:var(--s3) var(--s4);min-height:56px}
.list-item+.list-item{border-top:1px solid var(--outline-v)}
.grow{flex:1;min-width:0}
.empty{color:var(--on-surface-v);text-align:center;padding:var(--s6) var(--s4)}
mark{background:var(--tertiary-container);color:var(--on-tertiary-container);border-radius:4px;padding:0 2px}

/* chips */
.chips{display:flex;gap:var(--s2);overflow-x:auto;margin:0 calc(-1 * var(--s4));padding:0 var(--s4) var(--s1);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 var(--s4);border-radius:var(--rs);border:1px solid var(--outline-v);background:transparent;font-size:14px;font-weight:600;letter-spacing:.1px;color:var(--on-surface-v);display:inline-flex;align-items:center;gap:var(--s2)}
.chip.on{background:var(--secondary-container);border-color:transparent;color:var(--on-secondary-container)}
.chip .sw{width:10px;height:10px;border-radius:50%;background:var(--rc)}
.badge{display:inline-flex;align-items:center;height:24px;padding:0 var(--s2);border-radius:var(--rs);font-size:12px;font-weight:600;letter-spacing:.4px;white-space:nowrap}
.badge.primary{background:var(--primary);color:var(--on-primary)}
.badge.tonal{background:var(--primary-container);color:var(--on-primary-container)}
.badge.warn{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.badge.region{background:var(--rbg);color:var(--rfg)}

/* stats row */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin-top:var(--s5)}
.stat{background:rgba(255,255,255,.55);border-radius:var(--rm);padding:var(--s3)}
.stat b{display:block;font-size:24px;line-height:32px;font-weight:500}
.progress{height:8px;border-radius:4px;background:rgba(255,255,255,.55);margin-top:var(--s5);overflow:hidden}
.progress i{display:block;height:100%;border-radius:4px;background:var(--primary)}

.chips.sticky{position:sticky;top:calc(env(safe-area-inset-top) + 64px);z-index:10;background:var(--surface);padding-top:var(--s2);padding-bottom:var(--s2)}
.loc{width:100%;text-align:left;border:0;background:var(--surface-low);border-radius:var(--rl);padding:var(--s4);display:flex;gap:var(--s4);align-items:center}
.loc:active{background:var(--surface-c)}
.locn{width:56px;height:56px;flex:none;border-radius:var(--rl);background:var(--rbg);color:var(--rfg);display:flex;flex-direction:column;align-items:center;justify-content:center}
.locn b{font-size:22px;line-height:26px;font-weight:500}
.locn span{font-size:11px;line-height:14px;font-weight:600}
.loc-hero{background:var(--rbg);color:var(--rfg);margin:var(--s3) 0 var(--s4);padding:var(--s4) var(--s5)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s5)}
.pg{border:0;background:var(--surface-low);border-radius:var(--rl);padding:var(--s3) var(--s4);display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.pg.r{align-items:flex-end}
/* ===== Flights ===== */
.flight{background:var(--surface-low);border-radius:var(--rl);padding:var(--s4)}
.flight .head{display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}
.flight .route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--s3);margin:var(--s4) 0 var(--s2)}
.flight .ap{font-size:28px;line-height:36px;font-weight:500}
.flight .end{text-align:right}
.flight .line{display:flex;align-items:center;gap:var(--s1);color:var(--outline)}
.flight .line::before,.flight .line::after{content:"";width:20px;height:1px;background:var(--outline-v)}
.flight .line svg{width:18px;height:18px}
.flight .foot{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--outline-v)}
.code{height:40px;padding:0 var(--s4);border-radius:20px;border:0;background:var(--secondary-container);color:var(--on-secondary-container);font-size:15px;font-weight:600;letter-spacing:1.5px;display:inline-flex;align-items:center;gap:var(--s2)}
.code svg{width:18px;height:18px}
.flight.past{opacity:.5}

/* ===== Days ===== */
.day{background:var(--surface-low);border-radius:var(--rl);overflow:hidden}
.day .dh{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s4) var(--s4) var(--s2)}
.datebox{width:48px;flex:none;border-radius:var(--rm);background:var(--rbg);color:var(--rfg);text-align:center;padding:var(--s1) 0 6px}
.datebox b{display:block;font-size:22px;line-height:28px;font-weight:500}
.datebox span{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.5px}
.day.today{box-shadow:inset 0 0 0 2px var(--primary)}
.stops{padding:0 var(--s4) var(--s2)}
.stop{display:flex;gap:var(--s3);padding:var(--s2) 0;align-items:flex-start}
.num{width:24px;height:24px;flex:none;border-radius:50%;background:var(--rfg);color:var(--rbg);display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:0}
.stop .w{font-size:15px;line-height:22px;font-weight:500;word-wrap:break-word}
.stop.opt .num{background:transparent;border:1.5px dashed var(--outline);color:var(--outline)}
.stop.opt .w{color:var(--on-surface-v)}
.stop .meta{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s1);align-items:center}
.stop .meta a,.notes a{color:var(--primary);font-weight:600}
.mapbtn{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--primary);margin:-6px -6px 0 0}
.mapbtn:active{background:var(--surface-high)}
.mapbtn svg{width:20px;height:20px}
.drive{display:flex;gap:var(--s3);align-items:center;padding:2px 0;color:var(--on-surface-v)}
.drive .rail{width:24px;display:flex;justify-content:center}
.drive .rail::before{content:"";height:24px;border-left:2px dotted var(--outline-v)}
.drive svg{width:16px;height:16px;flex:none}
.notes{margin:var(--s2) var(--s4) var(--s4);padding:var(--s3);background:var(--surface-c);border-radius:var(--rm)}
.day .pad-b{height:var(--s2)}

/* ===== Pack ===== */
.ck{width:24px;height:24px;border-radius:6px;border:2px solid var(--outline);flex:none;display:grid;place-items:center}
.ck.y{background:var(--primary);border-color:var(--primary)}
.ck.y svg{width:16px;height:16px;stroke:var(--on-primary);stroke-width:3}
.done .item{color:var(--on-surface-v);text-decoration:line-through}

/* ===== Lock ===== */
#lock{position:fixed;inset:0;z-index:50;background:var(--surface);display:none;flex-direction:column;align-items:center;justify-content:center;padding:var(--s5);text-align:center}
#lock .box{width:100%;max-width:340px}
#lock .lk{width:64px;height:64px;border-radius:var(--rl);background:var(--primary-container);color:var(--on-primary-container);display:grid;place-items:center;margin:0 auto var(--s5)}
#lock .lk svg{width:28px;height:28px}
#lock h2{margin:0 0 var(--s2);font-size:28px;line-height:36px;font-weight:500}
#lock p{color:var(--on-surface-v);margin:0 0 var(--s5)}
#lock input{width:100%;height:56px;font:16px var(--font);padding:0 var(--s4);border-radius:var(--rs) var(--rs) 0 0;border:0;border-bottom:1px solid var(--outline);outline:none;background:var(--surface-high);color:var(--on-surface)}
#lock input:focus{border-bottom:2px solid var(--primary)}
#lock button{margin-top:var(--s5);width:100%;height:48px;border-radius:24px;border:0;background:var(--primary);color:var(--on-primary);font-weight:600;font-size:15px;letter-spacing:.1px}
#lock .err{color:#ba1a1a;font-size:14px;min-height:20px;margin-top:var(--s3)}
</style>
</head>
<body>
<div id="lock"><div class="box">
  <div class="lk"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
  <h2>Private</h2>
  <p>Enter the passcode to continue</p>
  <input id="pass" type="password" placeholder="Passcode" autocomplete="current-password" autocapitalize="off" autocorrect="off">
  <button id="unlock">Continue</button>
  <div class="err" id="err"></div>
</div></div>

<header id="hdr">
  <div class="bar">
    <div class="sync"><i id="dot"></i><span id="status">Loading</span></div>
    <button class="ib" id="btnSearch" aria-label="Search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button class="ib" id="btnRefresh" aria-label="Sync"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button>
  </div>
  <div id="searchWrap"><input id="search" type="search" placeholder="Search places, flights, codes" autocomplete="off"></div>
</header>
<main id="view"></main>
<nav id="nav"><div class="in">
  <button data-v="plan"><span class="ind"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></span>Plan</button>
  <button data-v="today"><span class="ind"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>Today</button>
  <button data-v="flights"><span class="ind"><svg class="i" viewBox="0 0 24 24"><path d="M2 16l20-6-3-2-6 1-5-6H6l2 7-4 1-2-2H1l1 5z"/><path d="M3 21h18"/></svg></span>Flights</button>
  <button data-v="pack"><span class="ind"><svg class="i" viewBox="0 0 24 24"><path d="M9 6V4h6v2"/><rect x="4" y="6" width="16" height="15" rx="2"/><path d="m9 13 2 2 4-4"/></svg></span>Pack</button>
</div></nav>

<script>
// The sheet's address is stored encrypted with the passcode (see build.mjs).
const LOCKED = {"salt":"TVD2PtvcjdA+Di+Av+FrJw==","iv":"fpMGBwI/2z21l/cW","iter":250000,"ct":"ufcnsw+3uRu8s5nVvNzotpW/+batAZ95UOrjaVVf2yGzclX5Wu34GSukr5R+VOYBm8b/OKh6K0g+VThZ"};
const TABS = {
  checklist:"1467656792", flights:"342526667", cars:"313607459", timeline:"985507720",
  r_chalten:"476445504", r_bariloche:"1001717172", r_carretera:"1253178163", r_salta:"1071236695"
};
const REGIONS = [
  {key:"r_chalten",   name:"El Calafate & Chaltén", short:"Calafate", tone:"r1", match:/calafate|chalt/i},
  {key:"r_bariloche", name:"Bariloche", short:"Bariloche", tone:"r2", match:/bariloche/i},
  {key:"r_carretera", name:"Carretera Austral", short:"Carretera", tone:"r3", match:/carretera/i},
  {key:"r_salta",     name:"Salta & Jujuy", short:"Salta", tone:"r4", match:/salta/i},
];
const BA = {name:"Buenos Aires", short:"Buenos Aires", tone:"r5"};
const TRAVEL = {name:"Travel days", short:"Travel", tone:"r6"};
const AIRLINES = {LY:"El Al", AR:"Aerolíneas Argentinas"};
const CACHE_KEY="trip-data-v2", KEY_KEY="trip-key-v2";
const I={car:'<svg class="i" viewBox="0 0 24 24"><path d="M5 17h14M3 13l2-6h14l2 6v4H3z"/><circle cx="7.5" cy="17" r="1.8"/><circle cx="16.5" cy="17" r="1.8"/></svg>',plane:'<svg class="i" viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" transform="rotate(90 12 12)"/></svg>',pin:'<svg class="i" viewBox="0 0 24 24"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3z"/><path d="M9 4v13M15 7v13"/></svg>',
  copy:'<svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>',
  chk:'<svg class="i" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>',
  chev:'<svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="m9 6 6 6-6 6"/></svg>'};

// ---------- crypto ----------
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
async function deriveKey(pass){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]);
  return crypto.subtle.deriveBits({name:"PBKDF2",salt:b64d(LOCKED.salt),iterations:LOCKED.iter,hash:"SHA-256"},base,256);
}
async function decryptSheet(raw){
  const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(LOCKED.iv)},k,b64d(LOCKED.ct)));
}
let SHEET=null;

// ---------- csv ----------
function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=""; } else if(c!=='\r') f+=c; }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows.map(r=>r.map(x=>x.trim()));
}
const cell=(r,i)=>(r&&r[i]?r[i]:"").trim();

// ---------- dates ----------
function pDMY(s){ const m=String(s).match(/(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/); if(!m) return null;
  let y=+m[3]; if(y<100) y+=2000; return new Date(y,+m[2]-1,+m[1]); }
const key=d=>d?`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`:"";
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());};
const fmt=(d,o={weekday:"short",day:"numeric",month:"short"})=>d?d.toLocaleDateString("en-GB",o):"";
const dayDiff=(a,b)=>Math.round((a-b)/864e5);
const stripEmoji=s=>String(s||"").replace(/[\p{Extended_Pictographic}\u200d\ufe0f]/gu,"").replace(/\s+/g," ").trim();

// ---------- parsers ----------
function parseTimeline(rows){
  const days=[], weather=[]; let inWx=false;
  for(const r of rows){
    if(cell(r,0)==="Dates"){inWx=true;continue;}
    if(inWx){ if(cell(r,0)) weather.push({dates:cell(r,0),loc:cell(r,1),day:cell(r,2),night:cell(r,3),bring:cell(r,4)}); continue; }
    const d=pDMY(cell(r,1)); if(!d) continue;
    days.push({date:d,dow:cell(r,0),loc:stripEmoji(cell(r,2)),locRaw:cell(r,2),what:stripEmoji(cell(r,3)),night:cell(r,4)});
  }
  return {days,weather};
}
function parseFlights(rows){
  const out=[];
  for(const r of rows){ const no=cell(r,3); if(!/^[A-Z0-9]{2}\s?\d{2,5}$/.test(no)) continue;
    const [from,to]=cell(r,1).split(/\n?→/).map(s=>s.trim());
    out.push({date:pDMY(cell(r,0)),dateRaw:cell(r,0),fromCity:from||"",toCity:to||"",dep:cell(r,2),no,arr:cell(r,4),
      fromAp:cell(r,5),toAp:cell(r,6),layover:cell(r,7).trim(),code:cell(r,8)}); }
  return out.sort((a,b)=>(a.date||0)-(b.date||0)||a.dep.localeCompare(b.dep));
}
const isDrive=it=>/🚗|🚐/.test(it.emoji)&&/drive|→|^from |^to /i.test(it.what);
function parseRegion(rows){
  const hi=rows.findIndex(r=>r.some(c=>c==="what")); const days=[]; let cur=null;
  for(let i=hi+1;i<rows.length;i++){ const r=rows[i]; const d=pDMY(cell(r,0));
    if(d && /day/i.test(cell(r,1))){
      cur={date:d,label:cell(r,1),title:cell(r,3),route:cell(r,6).replace(/^\[|\]$/g,"").trim(),items:[],notes:[]};
      days.push(cur); [10,9].forEach(c=>cell(r,c)&&cur.notes.push(cell(r,c))); continue; }
    if(!cur) continue;
    const what=cell(r,3); if(cell(r,10)) cur.notes.push(cell(r,10));
    if(!what){ if(cell(r,9)) cur.notes.push(cell(r,9)); continue; }
    const extra=cell(r,4);
    cur.items.push({emoji:cell(r,2),what:(extra?`${what} → ${extra}`:what).replace(/\u200f/g,"").replace(/\s+/g," ").trim(),eta:cell(r,1),time:cell(r,5),dur:cell(r,8),note:cell(r,9)}); }
  return days;
}
function parseChecklist(rows){
  return rows.slice(1).filter(r=>cell(r,3)).map(r=>({done:cell(r,1).toUpperCase()==="TRUE",
    cat:cell(r,2)||(cell(r,5)==="sleeper car"?"Car camping":"Other"),item:cell(r,3),qty:cell(r,4),notes:cell(r,5)==="sleeper car"?"":cell(r,5)}));
}
function parseCars(rows){
  const groups=[]; let g=null;
  for(const r of rows){ const a=cell(r,1), car=cell(r,3);
    if(/^Matt?ress/i.test(a)) break;
    if(/\(\d+\s*days?\)/i.test(a)){ g={name:a.replace(/\s*\(.*\)/,""),days:(a.match(/\((.*)\)/)||[])[1]||"",info:[],opts:[]}; groups.push(g); }
    if(!g) continue; let note="";
    if(a && !/\(\d+\s*days?\)/i.test(a)){ const d1=pDMY(a), d2=pDMY(cell(r,2));
      if(d1) g.info.push(`${fmt(d1,{day:"2-digit",month:"short"})} → ${fmt(d2,{day:"2-digit",month:"short"})}`);
      else if(/\d{1,2}:\d{2}/.test(a)) g.info.push(`Pick-up ${a.replace(/\s*\(.*?\)/,"")} · Return ${cell(r,2).replace(/\s*\(.*?\)/,"")}`);
      else note=a; }
    if(car) g.opts.push({car:car.split("\n")[0].replace(/ Fleet\.or_similar| or similar/i,"").trim(),cls:(car.split("\n")[1]||"").trim(),
      gear:cell(r,4),total:cell(r,9),co:cell(r,11),note,extra:/border/i.test(cell(r,7))?cell(r,7).split("\n").filter(x=>/border/i.test(x)).join("").trim():""}); }
  return groups;
}

// ---------- data ----------
let DATA=null;
async function fetchTab(gid){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),12000);
  try{ const res=await fetch(`https://docs.google.com/spreadsheets/d/${SHEET}/export?format=csv&gid=${gid}&_=${Date.now()}`,{signal:ctl.signal,cache:"no-store"});
    if(!res.ok) throw new Error(res.status); return await res.text(); } finally{ clearTimeout(t); }
}
async function loadFresh(){
  const raw=Object.fromEntries(await Promise.all(Object.entries(TABS).map(async([k,g])=>[k,await fetchTab(g)])));
  try{ localStorage.setItem(CACHE_KEY,JSON.stringify({at:Date.now(),raw})); }catch(e){}
  return {at:Date.now(),raw,fresh:true};
}
function loadCached(){ try{ const j=JSON.parse(localStorage.getItem(CACHE_KEY)); return j&&j.raw?{...j,fresh:false}:null; }catch(e){ return null; } }
function build(src){
  const R=k=>parseCSV(src.raw[k]||""); const tl=parseTimeline(R("timeline"));
  return {at:src.at,fresh:src.fresh,timeline:tl.days,weather:tl.weather,flights:parseFlights(R("flights")),
    checklist:parseChecklist(R("checklist")),cars:parseCars(R("cars")),regions:REGIONS.map(x=>({...x,days:parseRegion(R(x.key))}))};
}
function ago(ts){ const m=Math.round((Date.now()-ts)/60000);
  if(m<1) return "just now"; if(m<60) return m+"m ago"; const h=Math.round(m/60); if(h<36) return h+"h ago";
  return fmt(new Date(ts),{day:"numeric",month:"short"}); }
function setStatus(){ if(!DATA) return;
  document.getElementById("dot").className=DATA.fresh?"":"off";
  document.getElementById("status").textContent=(DATA.fresh?"Updated ":"Offline · saved ")+ago(DATA.at); }
let busy=false;
async function refresh(){
  if(busy||!SHEET) return; busy=true;
  const b=document.getElementById("btnRefresh"); b.classList.add("spin"); document.getElementById("status").textContent="Updating…";
  try{ DATA=build(await loadFresh()); }
  catch(e){ const c=loadCached(); if(c) DATA=build(c); else if(!DATA){ document.getElementById("view").innerHTML=`<div class="empty">Can't reach the sheet and nothing is saved yet.<br>Open once with internet.</div>`; } else DATA.fresh=false; }
  busy=false; b.classList.remove("spin"); setStatus(); render();
}

// ---------- helpers ----------
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const linkify=s=>esc(s).replace(/(https?:\/\/[^\s<]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener">Open link</a>`).replace(/\n/g,"<br>");
const mapUrl=(q,area)=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(stripEmoji(q).replace(/^\*?\s*(optional:)?\s*|^(drive to|or drive to|from)\s+/ig,"").replace(/\(.*?\)/g,"").split("→").pop().trim()+", "+area)}`;
let HL="";
const hl=s=>{ const e=esc(s); if(!HL) return e; return e.replace(new RegExp("("+HL.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>"); };
function regionFor(d,pref){ const k=key(d);
  const own=r=>{ const day=r.days.find(x=>key(x.date)===k); return day?{r,day}:null; };
  if(pref&&pref.days) return own(pref);
  const td=DATA.timeline.find(x=>key(x.date)===k); const p=td?placeOf(td):null;
  if(p&&p.days){ const o=own(p); if(o) return o; }
  for(const r of DATA.regions){ const o=own(r); if(o) return o; } return null; }
function placeOf(td){ if(!td) return TRAVEL;
  for(const r of DATA.regions) if(r.match.test(td.locRaw)) return r; if(/buenos/i.test(td.locRaw)) return BA; return TRAVEL; }
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const nice=s=>cap(stripEmoji(s).replace(/^\*\s*/,"").replace(/^optional:\s*/i,"").replace(/\s*>\s*/g," → ").replace(/^Buenos$/i,"Buenos Aires"));
const longDate=d=>fmt(d,{weekday:"long",day:"numeric",month:"long"});
function rel(d){ const n=dayDiff(d,today()); return n===0?"Today":n===1?"Tomorrow":n>1&&n<=6?`In ${n} days`:""; }
const rv=p=>`--rbg:var(--${p.tone});--rfg:var(--${p.tone}o)`;
const section=(t,s="")=>`<div class="section"><span class="title-l">${t}</span>${s?`<span class="body-m v">${s}</span>`:""}</div>`;
const pageTitle=(t,s="")=>`<div class="page-title"><div class="display-s">${t}</div>${s?`<div class="sub body-l v">${s}</div>`:""}</div>`;
const datebox=d=>`<div class="datebox"><span>${fmt(d,{weekday:"short"}).toUpperCase()}</span><b>${d.getDate()}</b><span>${fmt(d,{month:"short"}).toUpperCase()}</span></div>`;

function dayCard(r,day,{tag=true}={}){
  const isT=key(day.date)===key(today()); let n=0;
  const items=day.items.map(it=>{
    const drive=isDrive(it), opt=/optional|^\*|^or /i.test(it.what.trim());
    const tm=it.time?it.time.trim():(it.eta?it.eta.replace(/[~\s]/g,"")+":00":"");
    if(drive) return `<div class="drive"><div class="rail"></div>${I.car}<span class="body-m">${hl(nice(it.what).replace(/^(Drive to|From|To)\s+/i,""))}${it.dur?` · ${esc(it.dur.replace(/\s*drive/i,""))}`:""}${tm?` · ${esc(tm)}`:""}</span></div>`;
    n++;
    const meta=[tm&&`<span class="badge tonal">${esc(tm)}</span>`,it.dur&&`<span class="body-m v">${esc(it.dur)}</span>`,it.note&&`<span class="body-m v">${linkify(it.note)}</span>`].filter(Boolean).join("");
    return `<div class="stop ${opt?"opt":""}"><div class="num">${n}</div><div class="grow">
      <div class="w">${hl(nice(it.what).replace(/^Or\s+/,""))}${opt?` <span class="badge warn" style="height:20px;font-size:11px">Optional</span>`:""}</div>
      ${meta?`<div class="meta">${meta}</div>`:""}</div>
      <a class="mapbtn" href="${mapUrl(it.what,r.short)}" target="_blank" rel="noopener" aria-label="Open in Maps">${I.pin}</a></div>`;}).join("");
  const notes=[...new Set(day.notes)].filter(n=>!/^(FALSE|TRUE)$/.test(n));
  return `<div class="day ${isT&&tag?"today":""}" id="d-${key(day.date)}" style="${rv(r)}">
    <div class="dh">${datebox(day.date)}<div class="grow"><div class="title-m">${hl(nice(day.title||day.label))}</div>
      <div class="body-m v">${esc(day.label)}${day.route?" · "+hl(day.route):""}</div>
      ${isT&&tag?'<div style="margin-top:6px"><span class="badge primary">Today</span></div>':""}</div></div>
    ${items?`<div class="stops">${items}</div>`:`<div class="stops body-m v" style="padding-bottom:16px">Nothing planned yet</div>`}
    ${notes.length?`<div class="notes"><div class="label-m v" style="margin-bottom:4px">Notes</div><div class="body-m">${notes.map(linkify).join("<br>")}</div></div>`:'<div class="pad-b"></div>'}</div>`;
}
const city=s=>esc(s.replace(/\n/g," ").replace(/^Buenos$/i,"Buenos Aires"));
function flightCard(f){
  const past=f.date&&f.date<today(), r=f.date?rel(f.date):"";
  return `<div class="flight ${past?"past":""}">
    <div class="head"><div><div class="title-s">${esc(AIRLINES[f.no.slice(0,2)]||"Flight")} · ${esc(f.no)}</div><div class="body-m v">${f.date?longDate(f.date):""}</div></div>
      ${r&&!past?`<span class="badge ${r==="Today"||r==="Tomorrow"?"primary":"tonal"}">${r}</span>`:""}</div>
    <div class="route"><div><div class="ap">${esc(f.fromAp)}</div><div class="body-m v">${city(f.fromCity)}</div><div class="title-m">${esc(f.dep)}</div></div>
      <div class="line">${I.plane}</div>
      <div class="end"><div class="ap">${esc(f.toAp)}</div><div class="body-m v">${city(f.toCity)}</div><div class="title-m">${esc(f.arr)||"–"}</div></div></div>
    ${f.layover?`<span class="badge warn">${esc(f.layover)} layover in ${esc(f.toAp)}</span>`:""}
    <div class="foot"><span class="body-m v">${f.code?"Booking code":"No booking code"}</span>${f.code?`<button class="code" data-copy="${esc(f.code)}">${esc(f.code)}${I.copy}</button>`:""}</div>
  </div>`;
}

function locations(){
  const m=new Map();
  for(const d of DATA.timeline){ const p=placeOf(d); if(!m.has(p)) m.set(p,{p,days:[],ranges:[]}); m.get(p).days.push(d); }
  for(const r of DATA.regions){ if(!m.has(r)) m.set(r,{p:r,days:[],ranges:[]}); const l=m.get(r);
    for(const day of r.days) if(!l.days.some(d=>key(d.date)===key(day.date))) l.days.push(DATA.timeline.find(t=>key(t.date)===key(day.date))||{date:day.date,loc:r.name,locRaw:r.name}); }
  for(const l of m.values()){ l.days.sort((a,b)=>a.date-b.date);
    for(const d of l.days){ const r=l.ranges[l.ranges.length-1]; if(r&&dayDiff(d.date,r[1])===1) r[1]=d.date; else l.ranges.push([d.date,d.date]); } }
  return [...m.values()].filter(l=>l.days.length).sort((a,b)=>a.days[0].date-b.days[0].date);
}

    flush(); h+=`</div>`;
    const prev=L[LOC-1], next=L[LOC+1];
    h+=`<div class="pager">${prev?`<button class="pg" data-loc="${LOC-1}"><span class="body-m v">Previous</span><span class="title-s">‹ ${esc(prev.p.short)}</span></button>`:"<span></span>"}${next?`<button class="pg r" data-loc="${LOC+1}"><span class="body-m v">Next</span><span class="title-s">${esc(next.p.short)} ›</span></button>`:"<span></span>"}</div>`;

  flights(){

  },
  cars(){
    if(!DATA.cars.length) return `<div class="empty">No car info found.</div>`;
    const tone={Calafate:"r1",Bariloche:"r2",Salta:"r4"};
    return pageTitle("Cars","Rental options from the sheet")+DATA.cars.map(g=>{const tn=Object.entries(tone).find(([k])=>g.name.includes(k))?.[1]||"r6";
      return `<div class="section" style="${rv({tone:tn})}"><span class="title-l">${esc(g.name)}</span><span class="badge region">${esc(g.days)}</span></div>
      ${g.info.length?`<div class="body-m v" style="margin:-4px 4px 12px">${g.info.map(esc).join(" · ")}</div>`:""}
      <div class="card flat">${g.opts.map(o=>`<div class="list-item"><div class="grow"><div class="title-m">${esc(o.car)}</div>
        <div class="body-m v">${[o.co,o.gear,o.cls].filter(Boolean).map(esc).join(" · ")}</div>
        ${o.note||o.extra?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">${o.note?`<span class="badge tonal">${esc(o.note)}</span>`:""}${o.extra?`<span class="badge warn">${esc(o.extra)}</span>`:""}</div>`:""}</div>
        <div class="title-m">${esc(o.total)}</div></div>`).join("")}</div>`;}).join("");
  },
  pack(){
    const L=DATA.checklist, done=L.filter(i=>i.done).length;
    const cats={}; L.forEach(i=>(cats[i.cat]??=[]).push(i));
    let h=`<div style="height:8px"></div><div class="card hero"><div class="label-l v">Packing</div><div class="display-s" style="margin-top:4px">${done} of ${L.length}</div><div class="body-l v">Tick items in the sheet to update this</div>
      <div class="progress"><i style="width:${L.length?Math.round(done/L.length*100):0}%"></i></div></div>`;
    for(const [c,items] of Object.entries(cats)){ const left=items.filter(i=>!i.done).length;
      h+=section(esc(cap(c)),left?`${left} left`:"All packed")+`<div class="card flat">${items.sort((a,b)=>a.done-b.done).map(i=>`<div class="list-item ${i.done?"done":""}"><div class="ck ${i.done?"y":""}">${i.done?I.chk:""}</div><div class="grow"><div class="body-l item">${esc(cap(i.item))}</div>${i.notes?`<div class="body-m v">${esc(i.notes)}</div>`:""}</div>${i.qty&&i.qty!=="1"?`<span class="body-m v">${esc(i.qty)}</span>`:""}</div>`).join("")}</div>`; }
    return h;
  },
  search(){
    const q=HL.toLowerCase(); let h="", n=0, p="";
    const fl=DATA.flights.filter(f=>[f.fromCity,f.toCity,f.no,f.code,f.fromAp,f.toAp].join(" ").toLowerCase().includes(q));
    if(fl.length) h+=section("Flights",fl.length)+`<div class="stack">${fl.map(flightCard).join("")}</div>`;
    for(const r of DATA.regions) for(const d of r.days)
      if([r.name,d.title,d.route,...d.items.map(i=>i.what+" "+i.note),...d.notes].join(" ").toLowerCase().includes(q)){ p+=dayCard(r,d); n++; }
    if(n) h+=section("Days",n)+`<div class="stack">${p}</div>`;
    return h||`<div class="empty">Nothing found for “${esc(HL)}”</div>`;
  }
};
function render(){
  if(!DATA) return;
  document.getElementById("view").innerHTML=V[HL?"search":VIEW]();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",!HL&&b.dataset.v===VIEW));
}
function goto(k){ VIEW="plan"; HL=""; const L=locations(); const td=DATA.timeline.find(x=>key(x.date)===k), pp=td?placeOf(td):null; let i=L.findIndex(l=>l.p===pp); if(i<0) i=L.findIndex(l=>l.days.some(d=>key(d.date)===k)); LOC=i<0?null:i; render(); const el=document.getElementById("d-"+k);
  if(el) scrollTo({top:el.getBoundingClientRect().top+scrollY-document.getElementById("hdr").offsetHeight-12,behavior:"smooth"}); }
// ---------- events ----------
document.getElementById("nav").onclick=e=>{const b=e.target.closest("button"); if(!b) return;
  VIEW=b.dataset.v; HL=""; document.getElementById("search").value=""; document.getElementById("searchWrap").style.display="none";
  try{localStorage.setItem("trip-view",VIEW);}catch(_){}
  render(); scrollTo(0,0);
  if(false){ const el=document.querySelector(".day.is-today"); el&&goto(el.id.slice(2)); } };
document.getElementById("view").onclick=e=>{
  const c=e.target.closest("[data-loc]"); if(c){ LOC=c.dataset.loc===""?null:+c.dataset.loc; render(); scrollTo(0,0); const on=document.querySelector(".chip.on"); on&&on.scrollIntoView({inline:"center",block:"nearest"}); return; }
  const g=e.target.closest("[data-goto]"); if(g){ goto(g.dataset.goto); return; }
  const cp=e.target.closest("[data-copy]"); if(cp){ navigator.clipboard?.writeText(cp.dataset.copy).then(()=>{const t=cp.innerHTML; cp.textContent="Copied"; setTimeout(()=>cp.innerHTML=t,1200);}); }
};
document.getElementById("btnSearch").onclick=()=>{const w=document.getElementById("searchWrap"),s=document.getElementById("search");
  const show=w.style.display!=="block"; w.style.display=show?"block":"none"; if(show) s.focus(); else { s.value=""; HL=""; render(); } };
document.getElementById("search").oninput=e=>{ HL=e.target.value.trim(); render(); };
document.getElementById("btnRefresh").onclick=refresh;
addEventListener("scroll",()=>document.getElementById("hdr").classList.toggle("line",scrollY>4),{passive:true});
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&DATA&&Date.now()-DATA.at>10*60000) refresh(); });
setInterval(setStatus,60000);

// ---------- unlock & start ----------
function start(){
  document.getElementById("lock").style.display="none";
  try{ const v=localStorage.getItem("trip-view"); VIEW=["plan","today","flights","pack"].includes(v)?v:"plan"; }catch(_){}
  const c=loadCached(); if(c){ DATA=build(c); setStatus(); render(); }
  refresh();
}
(async()=>{
  if(!LOCKED){ document.getElementById("view").innerHTML=`<div class="empty">Not configured.</div>`; return; }
  try{ const k=localStorage.getItem(KEY_KEY); if(k){ SHEET=await decryptSheet(b64d(k)); return start(); } }catch(_){ try{localStorage.removeItem(KEY_KEY);}catch(e){} }
  document.getElementById("lock").style.display="flex";
  const go=async()=>{ const p=document.getElementById("pass").value.trim(); if(!p) return;
    document.getElementById("err").textContent="";
    try{ const raw=await deriveKey(p); SHEET=await decryptSheet(raw); try{localStorage.setItem(KEY_KEY,b64e(raw));}catch(_){} start(); }
    catch(_){ document.getElementById("err").textContent="Incorrect passcode, try again"; } };
  document.getElementById("unlock").onclick=go;
  document.getElementById("pass").onkeydown=e=>{ if(e.key==="Enter") go(); };
})();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
