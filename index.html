<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Argentina Trip</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#16303f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Argentina">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f4efe7; --card:#fffdfa; --ink:#18242c; --muted:#6c7780; --faint:#a3abb1; --line:#e7dfd3;
  --accent:#c2562f; --accent-soft:#f6e2d7; --night:#16303f; --chip:#ece5da;
  --ok:#2f7d5b; --shadow:0 1px 1px rgba(24,36,44,.04),0 6px 20px rgba(24,36,44,.07);
  --r:20px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1519;--card:#182128;--ink:#edf1f3;--muted:#98a4ad;--faint:#5f6b74;--line:#26323a;
  --accent:#ec8a62;--accent-soft:#38261f;--night:#0b1216;--chip:#222d35;--ok:#5cc196;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
.serif{font-family:"New York","Iowan Old Style",Georgia,serif}

/* ---------- top bar ---------- */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid transparent;transition:border-color .2s}
header.scrolled{border-bottom-color:var(--line)}
.bar{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
.bar h1{font-size:22px;margin:0;flex:1;font-weight:700;letter-spacing:-.3px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:1px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.dot.off{background:#d99a2b}
.ib{width:38px;height:38px;border-radius:12px;border:0;background:var(--chip);display:grid;place-items:center;font-size:16px}
.ib.spin span{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#searchWrap{display:none;max-width:640px;margin:10px auto 0}
#search{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:16px;background:var(--card);color:var(--ink);outline:none}

main{padding:6px 16px calc(env(safe-area-inset-bottom) + 96px);max-width:640px;margin:0 auto}

/* ---------- tab bar ---------- */
nav{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:20;max-width:520px;margin:0 auto;
  background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:22px;display:flex;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
nav button{flex:1;background:none;border:0;color:var(--muted);font-size:10.5px;font-weight:600;padding:6px 0 4px;border-radius:16px;
  display:flex;flex-direction:column;align-items:center;gap:1px}
nav .e{font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.55;transition:.15s}
nav button.on{background:var(--chip);color:var(--ink)}
nav button.on .e{filter:none;opacity:1}

/* ---------- generic ---------- */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 10px}
.sec h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:0;font-weight:700}
.sec span{font-size:13px;color:var(--faint)}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
mark{background:#ffe08a;color:#18242c;border-radius:3px;padding:0 1px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:8px;padding:3px 8px;background:var(--chip);color:var(--ink);white-space:nowrap}
.pill.hot{background:var(--accent-soft);color:var(--accent)}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 18px;color:#fff;margin:8px 0 14px;
  background:var(--rc,#16303f);box-shadow:0 10px 30px color-mix(in srgb,var(--rc,#16303f) 35%,transparent)}
.hero::after{content:"";position:absolute;inset:auto -10% -40% -10%;height:70%;
  background:radial-gradient(ellipse at 30% 0%,rgba(255,255,255,.18),transparent 60%);pointer-events:none}
.hero .k{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.75}
.hero .big{font-size:34px;font-weight:700;letter-spacing:-.6px;line-height:1.1;margin:6px 0 4px}
.hero .sub{opacity:.85;font-size:15px}
.hero .facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.hero .facts span{background:rgba(255,255,255,.16);border-radius:10px;padding:5px 10px;font-size:13px;font-weight:600}
.prog{height:6px;background:rgba(255,255,255,.2);border-radius:6px;margin-top:16px;overflow:hidden;position:relative;z-index:1}
.prog i{display:block;height:100%;background:#fff;border-radius:6px}

/* ---------- day timeline ---------- */
.day{padding:0;overflow:hidden}
.dh{display:flex;gap:12px;align-items:center;padding:14px 16px 12px}
.dbadge{width:46px;flex:none;text-align:center;border-radius:12px;padding:5px 0;background:color-mix(in srgb,var(--rc) 14%,transparent);color:var(--rc)}
.dbadge b{display:block;font-size:20px;line-height:1.05}
.dbadge small{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.dtitle{flex:1;min-width:0}
.dtitle .t{font-weight:700;font-size:17px;letter-spacing:-.2px}
.dtitle .r{font-size:13px;color:var(--muted);margin-top:1px}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.6px;background:var(--accent);color:#fff;border-radius:6px;padding:3px 6px}
.tl{list-style:none;margin:0;padding:2px 16px 14px}
.tl li{position:relative;display:flex;gap:12px;padding:0 0 0 0}
.tl .rail{width:28px;flex:none;display:flex;flex-direction:column;align-items:center}
.tl .ico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:var(--chip);flex:none}
.tl .ln{flex:1;width:2px;background:var(--line);min-height:10px}
.tl li:last-child .ln{display:none}
.tl .body{flex:1;min-width:0;padding:3px 0 14px}
.tl .w{font-weight:600;word-wrap:break-word}
.tl .w.opt{font-weight:500;color:var(--muted)}
.tl .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.tl .note{font-size:13px;color:var(--muted);margin-top:4px;word-wrap:break-word}
.tl .note a,.notes a{color:var(--accent);font-weight:600}
.tl .mp{flex:none;align-self:flex-start;margin-top:2px;font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:3px 7px}
/* drives = connector rows */
.tl li.drive .ico{background:none;font-size:13px;height:22px}
.tl li.drive .body{padding:1px 0 12px}
.tl li.drive .w{font-weight:500;font-size:14px;color:var(--muted)}
.tl li.drive .ln{background:repeating-linear-gradient(var(--faint) 0 4px,transparent 4px 8px)}
.notes{margin:0 16px 16px;background:var(--accent-soft);border-radius:14px;padding:10px 12px;font-size:13.5px}
.notes b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);margin-bottom:3px}

/* ---------- plan ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;margin:6px -16px 4px;padding:4px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}
.strip{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 6px;padding:4px 16px 10px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.sd{flex:none;width:48px;border:0;border-radius:14px;padding:7px 0 6px;background:var(--card);border:1px solid var(--line);text-align:center}
.sd small{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase}
.sd b{display:block;font-size:17px;line-height:1.2}
.sd i{display:block;font-style:normal;font-size:13px;height:16px}
.sd.now{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sd.now small{color:inherit;opacity:.7}
.rhead{display:flex;align-items:center;gap:12px;margin:24px 2px 10px}
.rhead .em{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--rc) 16%,transparent)}
.rhead .n{font-weight:800;font-size:20px;letter-spacing:-.3px}
.rhead .d{font-size:13px;color:var(--muted)}
.simple{display:flex;gap:12px;align-items:center}

/* ---------- flights: boarding pass ---------- */
.bp{position:relative;background:var(--card);border-radius:var(--r);margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.bp .top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--rc);color:#fff}
.bp .air{font-weight:700;font-size:14px}
.bp .when{font-size:13px;opacity:.85}
.bp .mid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 16px 14px}
.bp .ap{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1}
.bp .city{font-size:13px;color:var(--muted);margin-top:3px}
.bp .tm{font-size:17px;font-weight:700;margin-top:8px}
.bp .r{text-align:right}
.bp .path{text-align:center;color:var(--faint);font-size:12px;padding:0 6px}
.bp .path .pl{font-size:20px;color:var(--rc)}
.bp .perf{position:relative;height:0;border-top:2px dashed var(--line);margin:0 16px}
.bp .perf::before,.bp .perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.bp .perf::before{left:-28px}.bp .perf::after{right:-28px}
.bp .bot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 14px;gap:10px}
.bp .lbl{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.bp .val{font-weight:700;font-size:15px}
.code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-weight:800;letter-spacing:2px;font-size:17px;border:0;background:var(--chip);border-radius:10px;padding:7px 12px}
.bp.past{opacity:.45}
.bp .soon{background:#fff;color:var(--rc);font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px}

/* ---------- pack ---------- */
.ring{display:flex;align-items:center;gap:16px}
.ring svg{flex:none}
.pk{list-style:none;margin:0;padding:0}
.pk li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.pk li:first-child{border-top:0;padding-top:2px}
.box{width:22px;height:22px;margin-top:1px;border-radius:7px;border:2px solid var(--faint);flex:none;display:grid;place-items:center;font-size:13px;color:#fff;font-weight:800}
.box.y{background:var(--ok);border-color:var(--ok)}
.pk .done .w{color:var(--faint);text-decoration:line-through}

/* ---------- cars ---------- */
.co{padding:12px 0;border-top:1px solid var(--line)}
.co:first-of-type{border-top:0}
.co .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.price{font-weight:800;white-space:nowrap}

/* ---------- lock ---------- */
#lock{position:fixed;inset:0;z-index:50;background:#16303f;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#lock .ico{font-size:48px;margin-bottom:10px}
#lock h2{margin:0 0 6px;font-size:24px}
#lock p{opacity:.75;margin:0 0 20px;font-size:15px}
#lock input{width:100%;max-width:300px;font-size:18px;text-align:center;padding:14px;border-radius:14px;border:0;outline:none;background:rgba(255,255,255,.12);color:#fff;letter-spacing:1px}
#lock input::placeholder{color:rgba(255,255,255,.5);letter-spacing:0}
#lock button{margin-top:12px;width:100%;max-width:300px;padding:14px;border-radius:14px;border:0;background:#ec8a62;color:#fff;font-weight:700;font-size:16px}
#lock .err{color:#ffb4a0;font-size:14px;height:20px;margin-top:10px}
</style>
</head>
<body>
<div id="lock">
  <div class="ico">🔒</div>
  <h2>Argentina Trip</h2>
  <p>Enter the passcode to open the plan.</p>
  <input id="pass" type="password" placeholder="Passcode" autocomplete="current-password" autocapitalize="off" autocorrect="off">
  <button id="unlock">Unlock</button>
  <div class="err" id="err"></div>
</div>

<header id="hdr">
  <div class="bar">
    <div style="flex:1;min-width:0">
      <h1 id="title">Argentina 🇦🇷</h1>
      <div class="sync"><span class="dot" id="dot"></span><span id="status">Loading…</span></div>
    </div>
    <button class="ib" id="btnSearch" aria-label="Search"><span>🔍</span></button>
    <button class="ib" id="btnRefresh" aria-label="Refresh from sheet"><span>↻</span></button>
  </div>
  <div id="searchWrap"><input id="search" type="search" placeholder="Search: glacier, rafting, AR1695…" autocomplete="off"></div>
</header>
<main id="view"></main>
<nav id="nav">
  <button data-v="today"><span class="e">☀️</span>Today</button>
  <button data-v="plan"><span class="e">🗺️</span>Plan</button>
  <button data-v="flights"><span class="e">✈️</span>Flights</button>
  <button data-v="cars"><span class="e">🚗</span>Cars</button>
  <button data-v="pack"><span class="e">🎒</span>Pack</button>
</nav>

<script>
// The sheet's address is stored encrypted with the passcode (see build.mjs). Without the
// passcode the page can't find the sheet, so it has nothing to show.
const LOCKED = {"salt":"8th68i39XaEfuBsmOi989A==","iv":"hngIQBAW71xQ+rzG","iter":250000,"ct":"3WQPceiwAsr5wxsxiBmzV9WI+aRVwxkYd6iC6xLGdoNAKwnSWrOGiOMN/B7sLtzUkXdSGQ433MnDvV2Q"};
const TABS = {
  checklist:"1467656792", flights:"342526667", cars:"313607459", timeline:"985507720",
  r_chalten:"476445504", r_bariloche:"1001717172", r_carretera:"1253178163", r_salta:"1071236695"
};
const REGIONS = [
  {key:"r_chalten",   name:"El Calafate & Chaltén", short:"Calafate", emoji:"🏔️", color:"#3b7aa3", match:/calafate|chalt/i},
  {key:"r_bariloche", name:"Bariloche", short:"Bariloche", emoji:"🌳", color:"#3f7a4c", match:/bariloche/i},
  {key:"r_carretera", name:"Carretera Austral", short:"Carretera", emoji:"🚐", color:"#2c7c78", match:/carretera/i},
  {key:"r_salta",     name:"Salta & Jujuy", short:"Salta", emoji:"🏜️", color:"#c2562f", match:/salta/i},
];
const BA = {name:"Buenos Aires", emoji:"🏙️", color:"#7a5a99"};
const TRAVEL = {name:"Travel", emoji:"✈️", color:"#16303f"};
const AIRLINES = {LY:"El Al", AR:"Aerolíneas Argentinas"};
const CACHE_KEY="trip-data-v2", KEY_KEY="trip-key-v1";

// ---------- crypto ----------
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
async function deriveKey(pass){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]);
  return crypto.subtle.deriveBits({name:"PBKDF2",salt:b64d(LOCKED.salt),iterations:LOCKED.iter,hash:"SHA-256"},base,256);
}
async function decryptSheet(raw){
  const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(LOCKED.iv)},k,b64d(LOCKED.ct));
  return new TextDecoder().decode(pt);
}
let SHEET=null;

// ---------- csv ----------
function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=""; }
    else if(c!=='\r') f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows.map(r=>r.map(x=>x.trim()));
}
const cell=(r,i)=>(r&&r[i]?r[i]:"").trim();

// ---------- dates ----------
function pDMY(s){ const m=String(s).match(/(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/); if(!m) return null;
  let y=+m[3]; if(y<100) y+=2000; return new Date(y,+m[2]-1,+m[1]); }
const key=d=>d?`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`:"";
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());};
const fmt=(d,o={weekday:"short",day:"numeric",month:"short"})=>d?d.toLocaleDateString("en-GB",o):"";
const dayDiff=(a,b)=>Math.round((a-b)/864e5);

// ---------- parsers ----------
function parseTimeline(rows){
  const days=[], weather=[]; let inWx=false;
  for(const r of rows){
    if(cell(r,0)==="Dates"){inWx=true;continue;}
    if(inWx){ if(cell(r,0)) weather.push({dates:cell(r,0),loc:cell(r,1),day:cell(r,2),night:cell(r,3),bring:cell(r,4)}); continue; }
    const d=pDMY(cell(r,1)); if(!d) continue;
    days.push({date:d,dow:cell(r,0),loc:cell(r,2).replace(/^[^\w]+/u,"").trim()||cell(r,2),locRaw:cell(r,2),what:cell(r,3),night:cell(r,4)});
  }
  return {days,weather};
}
function parseFlights(rows){
  const out=[];
  for(const r of rows){
    const no=cell(r,3); if(!/^[A-Z0-9]{2}\s?\d{2,5}$/.test(no)) continue;
    const [from,to]=cell(r,1).split(/\n?→/).map(s=>s.trim());
    out.push({date:pDMY(cell(r,0)),dateRaw:cell(r,0),fromCity:from||"",toCity:to||"",dep:cell(r,2),no,arr:cell(r,4),
      fromAp:cell(r,5),toAp:cell(r,6),layover:cell(r,7),code:cell(r,8)});
  }
  return out.sort((a,b)=>(a.date||0)-(b.date||0)||a.dep.localeCompare(b.dep));
}
const isDrive=it=>/🚗|🚐/.test(it.emoji)&&/drive|→|^from |^to /i.test(it.what);
function parseRegion(rows){
  const hi=rows.findIndex(r=>r.some(c=>c==="what")); const days=[]; let cur=null;
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]; const d=pDMY(cell(r,0));
    if(d && /day/i.test(cell(r,1))){
      cur={date:d,label:cell(r,1),title:cell(r,3),route:cell(r,6).replace(/^\[|\]$/g,"").trim(),items:[],notes:[]};
      days.push(cur); [10,9].forEach(c=>cell(r,c)&&cur.notes.push(cell(r,c))); continue;
    }
    if(!cur) continue;
    const what=cell(r,3);
    if(cell(r,10)) cur.notes.push(cell(r,10));
    if(!what){ if(cell(r,9)) cur.notes.push(cell(r,9)); continue; }
    const extra=cell(r,4);
    cur.items.push({emoji:cell(r,2),what:(extra?`${what} → ${extra}`:what).replace(/\u200f/g,""),eta:cell(r,1),time:cell(r,5),dur:cell(r,8),note:cell(r,9)});
  }
  return days;
}
function parseChecklist(rows){
  return rows.slice(1).filter(r=>cell(r,3)).map(r=>({done:cell(r,1).toUpperCase()==="TRUE",
    cat:cell(r,2)||(cell(r,5)==="sleeper car"?"Car camping":"Other"),item:cell(r,3),qty:cell(r,4),notes:cell(r,5)==="sleeper car"?"":cell(r,5)}));
}
function parseCars(rows){
  const groups=[]; let g=null;
  for(const r of rows){
    const a=cell(r,1), car=cell(r,3);
    if(/^Matt?ress/i.test(a)) break;
    if(/\(\d+\s*days?\)/i.test(a)){ g={name:a.replace(/\s*\(.*\)/,""),days:(a.match(/\((.*)\)/)||[])[1]||"",info:[],opts:[]}; groups.push(g); }
    if(!g) continue;
    let note="";
    if(a && !/\(\d+\s*days?\)/i.test(a)){
      const d1=pDMY(a), d2=pDMY(cell(r,2));
      if(d1) g.info.push(`${fmt(d1)} → ${fmt(d2)}`);
      else if(/\d{1,2}:\d{2}/.test(a)) g.info.push(`Pick up ${a.replace(/\s*\(.*?\)/,"")} · drop off ${cell(r,2).replace(/\s*\(.*?\)/,"")}`);
      else note=a;
    }
    if(car) g.opts.push({car:car.split("\n")[0].replace(/ Fleet\.or_similar| or similar/i,""),cls:(car.split("\n")[1]||"").trim(),
      gear:cell(r,4),total:cell(r,9),co:cell(r,11),note,extra:/border/i.test(cell(r,7))?cell(r,7).split("\n").filter(x=>/border/i.test(x)).join(""):""});
  }
  return groups;
}

// ---------- data ----------
let DATA=null;
async function fetchTab(gid){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),12000);
  try{ const res=await fetch(`https://docs.google.com/spreadsheets/d/${SHEET}/export?format=csv&gid=${gid}&_=${Date.now()}`,{signal:ctl.signal,cache:"no-store"});
    if(!res.ok) throw new Error(res.status); return await res.text(); } finally{ clearTimeout(t); }
}
async function loadFresh(){
  const raw=Object.fromEntries(await Promise.all(Object.entries(TABS).map(async([k,g])=>[k,await fetchTab(g)])));
  try{ localStorage.setItem(CACHE_KEY,JSON.stringify({at:Date.now(),raw})); }catch(e){}
  return {at:Date.now(),raw,fresh:true};
}
function loadCached(){ try{ const j=JSON.parse(localStorage.getItem(CACHE_KEY)); return j&&j.raw?{...j,fresh:false}:null; }catch(e){ return null; } }
function build(src){
  const R=k=>parseCSV(src.raw[k]||""); const tl=parseTimeline(R("timeline"));
  const regions=REGIONS.map(x=>({...x,days:parseRegion(R(x.key))}));
  return {at:src.at,fresh:src.fresh,timeline:tl.days,weather:tl.weather,flights:parseFlights(R("flights")),
    checklist:parseChecklist(R("checklist")),cars:parseCars(R("cars")),regions};
}
function ago(ts){ const m=Math.round((Date.now()-ts)/60000);
  if(m<1) return "just now"; if(m<60) return m+" min ago"; const h=Math.round(m/60); if(h<36) return h+"h ago";
  return fmt(new Date(ts),{day:"numeric",month:"short"}); }
function setStatus(){ if(!DATA) return;
  document.getElementById("dot").className="dot"+(DATA.fresh?"":" off");
  document.getElementById("status").textContent=(DATA.fresh?"Synced with sheet":"Offline copy")+" · "+ago(DATA.at); }
let busy=false;
async function refresh(){
  if(busy||!SHEET) return; busy=true;
  const b=document.getElementById("btnRefresh"); b.classList.add("spin");
  document.getElementById("status").textContent="Syncing…";
  try{ DATA=build(await loadFresh()); }
  catch(e){ const c=loadCached(); if(c) DATA=build(c); else if(!DATA){ document.getElementById("view").innerHTML=`<div class="empty">📶 Can't reach the sheet and there's no saved copy yet.<br>Open once with internet.</div>`; } else DATA.fresh=false; }
  busy=false; b.classList.remove("spin"); setStatus(); render();
}

// ---------- helpers ----------
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const linkify=s=>esc(s).replace(/(https?:\/\/[^\s<]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener">Open link ↗</a>`).replace(/\n/g,"<br>");
const mapUrl=(q,area)=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q.replace(/^\*?\s*(optional:)?\s*|^(drive to|or drive to|from)\s+/ig,"").replace(/\(.*?\)/g,"").split("→").pop().trim()+", "+area)}`;
let HL="";
const hl=s=>{ const e=esc(s); if(!HL) return e; return e.replace(new RegExp("("+HL.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>"); };
function regionFor(d){ for(const r of DATA.regions) for(const day of r.days) if(key(day.date)===key(d)) return {r,day}; return null; }
function placeOf(td){ if(!td) return TRAVEL; const rd=regionFor(td.date); if(rd) return rd.r;
  for(const r of DATA.regions) if(r.match.test(td.locRaw)) return r; if(/buenos/i.test(td.locRaw)) return BA; return TRAVEL; }

function dayCard(r,day,{tag=true}={}){
  const isT=key(day.date)===key(today());
  const items=day.items.map(it=>{
    const drive=isDrive(it); const opt=/optional|^\*|^or /i.test(it.what.trim());
    const pills=[it.time&&`<span class="pill hot">🕒 ${esc(it.time)}</span>`,it.eta&&`<span class="pill hot">~${esc(it.eta.replace(/~/g,"").trim())}:00</span>`,
      it.dur&&!drive&&`<span class="pill">⏱ ${esc(it.dur)}</span>`].filter(Boolean).join("");
    const w=drive?`${hl(it.what.replace(/^\s*/,""))}${it.dur?` · <b>${esc(it.dur)}</b>`:""}`:hl(it.what.replace(/^\*\s*/,""));
    return `<li class="${drive?"drive":""}"><div class="rail"><div class="ico">${esc(it.emoji)||"•"}</div><div class="ln"></div></div>
      <div class="body"><div class="w ${opt?"opt":""}">${opt&&!/^or /i.test(it.what.trim())?"Optional · ":""}${w}</div>
      ${pills&&!drive?`<div class="meta">${pills}</div>`:""}${drive&&it.time?`<div class="meta"><span class="pill hot">🕒 ${esc(it.time)}</span></div>`:""}
      ${it.note?`<div class="note">${linkify(it.note)}</div>`:""}</div>
      ${drive?"":`<a class="mp" href="${mapUrl(it.what,r.short)}" target="_blank" rel="noopener">Map</a>`}</li>`;}).join("");
  const notes=[...new Set(day.notes)].filter(n=>!/^(FALSE|TRUE)$/.test(n));
  return `<div class="card day" id="d-${key(day.date)}" style="--rc:${r.color}">
    <div class="dh"><div class="dbadge"><b>${day.date.getDate()}</b><small>${fmt(day.date,{weekday:"short"})}</small></div>
      <div class="dtitle"><div class="t">${hl(day.title||day.label)}</div><div class="r">${esc(day.label)}${day.route?" · "+hl(day.route):""}</div></div>
      ${tag&&isT?'<span class="tag">TODAY</span>':""}</div>
    ${items?`<ul class="tl">${items}</ul>`:`<div class="note muted small" style="padding:0 16px 16px">Nothing planned yet.</div>`}
    ${notes.length?`<div class="notes"><b>Notes & ideas</b>${notes.map(linkify).join("<br>")}</div>`:""}
  </div>`;
}
function flightCard(f){
  const t=today(); const past=f.date&&f.date<t; const n=f.date?dayDiff(f.date,t):null;
  const intl=/^LY/.test(f.no); const rc=intl?"#16303f":"#2a6f97";
  const soon=n===0?"TODAY":n===1?"TOMORROW":(n>1&&n<=7?`IN ${n} DAYS`:"");
  return `<div class="bp ${past?"past":""}" style="--rc:${rc}">
    <div class="top"><div><div class="air">${esc(AIRLINES[f.no.slice(0,2)]||"Flight")} · ${esc(f.no)}</div><div class="when">${f.date?fmt(f.date,{weekday:"long",day:"numeric",month:"long"}):esc(f.dateRaw)}</div></div>${soon&&!past?`<span class="soon">${soon}</span>`:""}</div>
    <div class="mid"><div><div class="ap">${esc(f.fromAp)}</div><div class="city">${esc(f.fromCity)}</div><div class="tm">${esc(f.dep)}</div></div>
      <div class="path"><div class="pl">✈︎</div>${f.layover?esc(f.layover.trim())+"<br>layover":""}</div>
      <div class="r"><div class="ap">${esc(f.toAp)}</div><div class="city">${esc(f.toCity)}</div><div class="tm">${esc(f.arr)||"—"}</div></div></div>
    <div class="perf"></div>
    <div class="bot"><div><div class="lbl">Booking code</div><div class="val muted small">${f.code?"Tap to copy":"Not in sheet"}</div></div>
      ${f.code?`<button class="code" data-copy="${esc(f.code)}">${esc(f.code)}</button>`:""}</div>
  </div>`;
}
const sec=(t,s="")=>`<div class="sec"><h2>${t}</h2><span>${s}</span></div>`;

// ---------- views ----------
let VIEW="today", REGION=null;
const V={
  today(){
    const t=today(), tl=DATA.timeline; if(!tl.length) return `<div class="empty">No timeline found in the sheet.</div>`;
    const first=tl[0].date, last=tl[tl.length-1].date;
    if(t>last) return `<div class="hero"><div class="k">Trip complete</div><div class="big">Welcome home 🏡</div><div class="sub">${tl.length} days · ${DATA.flights.length} flights</div></div>`;
    const before=t<first, target=before?first:t;
    const idx=tl.findIndex(d=>key(d.date)===key(target)); const td=tl[idx]; const pl=placeOf(td);
    let h="";
    if(before){ const n=dayDiff(first,t);
      h+=`<div class="hero" style="--rc:#16303f"><div class="k">Countdown</div><div class="big">${n===1?"Tomorrow! ✈️":n+" days to go"}</div>
        <div class="sub">Leaving ${fmt(first,{weekday:"long",day:"numeric",month:"long"})}</div>
        <div class="facts"><span>🗓️ ${tl.length} days</span><span>✈️ ${DATA.flights.length} flights</span><span>📍 ${DATA.regions.length+1} regions</span></div></div>`;
    } else {
      const pct=Math.round(((idx+1)/tl.length)*100);
      h+=`<div class="hero" style="--rc:${pl.color}"><div class="k">${fmt(t,{weekday:"long",day:"numeric",month:"long"})}</div>
        <div class="big">${pl.emoji} ${esc(td.loc)}</div><div class="sub">Day ${idx+1} of ${tl.length}${td.night?" · 🛏️ "+esc(td.night):""}</div>
        <div class="prog"><i style="width:${pct}%"></i></div></div>`;
    }
    const fl=DATA.flights.filter(f=>key(f.date)===key(target));
    if(fl.length) h+=sec(before?"First flights":"Flying today")+fl.map(flightCard).join("");
    const rd=regionFor(target);
    if(rd) h+=sec(before?"First day plan":"Today's plan")+dayCard(rd.r,rd.day,{tag:false});
    else if(!fl.length) h+=sec("Today")+`<div class="card"><div class="simple"><span style="font-size:24px">${pl.emoji}</span><div><b>${esc(td.loc)}</b><div class="small muted">No detailed plan in the sheet for this day.</div></div></div></div>`;
    const nx=tl[idx+1];
    if(nx){ const nr=regionFor(nx.date), np=placeOf(nx), nf=DATA.flights.filter(f=>key(f.date)===key(nx.date));
      h+=sec("Next day",fmt(nx.date))+`<div class="card" data-goto="${key(nx.date)}"><div class="simple"><span style="font-size:24px">${np.emoji}</span><div style="flex:1"><b>${nr?esc(nr.day.title):esc(nx.loc)}</b>
        <div class="small muted">${nr&&nr.day.route?esc(nr.day.route):esc(nx.loc)}${nf.length?` · ✈️ ${esc(nf[0].no)} at ${esc(nf[0].dep)}`:""}</div></div><span class="muted">›</span></div></div>`; }
    const wx=DATA.weather.find(w=>{const a=(w.loc||"").toLowerCase().split(" ")[0];return a&&(td?.locRaw||"").toLowerCase().includes(a);});
    if(wx) h+=sec("Weather & what to wear",esc(wx.dates))+`<div class="card"><div style="display:flex;gap:18px;margin-bottom:8px"><div><div class="small muted">Day</div><b style="font-size:20px">☀️ ${esc(wx.day)}</b></div><div><div class="small muted">Night</div><b style="font-size:20px">🌙 ${esc(wx.night)}</b></div></div><div class="small muted">${esc(wx.bring)}</div></div>`;
    return h;
  },
  plan(){
    const t=today();
    const chips=[`<button class="chip ${REGION==null?"on":""}" data-r="">All</button>`].concat(DATA.regions.map((r,i)=>`<button class="chip ${REGION===i?"on":""}" data-r="${i}">${r.emoji} ${esc(r.short)}</button>`)).join("");
    let h=`<div class="chips">${chips}</div>`;
    if(REGION==null){
      h+=`<div class="strip">`+DATA.timeline.map(d=>`<button class="sd ${key(d.date)===key(t)?"now":""}" data-goto="${key(d.date)}"><small>${fmt(d.date,{weekday:"short"})}</small><b>${d.date.getDate()}</b><i>${placeOf(d).emoji}</i></button>`).join("")+`</div>`;
      // group consecutive days by place
      const groups=[]; for(const d of DATA.timeline){ const p=placeOf(d); const g=groups[groups.length-1]; if(g&&g.p===p) g.days.push(d); else groups.push({p,days:[d]}); }
      for(const g of groups){
        const a=g.days[0].date,b=g.days[g.days.length-1].date;
        h+=`<div class="rhead" style="--rc:${g.p.color}"><div class="em">${g.p.emoji}</div><div><div class="n">${esc(g.p===TRAVEL?g.days.map(d=>d.loc).filter((v,i,s)=>s.indexOf(v)===i).join(" · "):g.p.name)}</div><div class="d">${fmt(a,{day:"numeric",month:"short"})}${g.days.length>1?" – "+fmt(b,{day:"numeric",month:"short"}):""} · ${g.days.length} day${g.days.length>1?"s":""}</div></div></div>`;
        for(const d of g.days){ const rd=regionFor(d.date);
          if(rd) h+=dayCard(rd.r,rd.day);
          else h+=`<div class="card day" id="d-${key(d.date)}" style="--rc:${g.p.color}"><div class="dh"><div class="dbadge"><b>${d.date.getDate()}</b><small>${fmt(d.date,{weekday:"short"})}</small></div><div class="dtitle"><div class="t">${esc(d.loc)}</div><div class="r">${esc(d.what||"Free day")}${d.night?" · 🛏️ "+esc(d.night):""}</div></div>${key(d.date)===key(t)?'<span class="tag">TODAY</span>':""}</div></div>`;
        }
      }
      return h;
    }
    const r=DATA.regions[REGION]; const a=r.days[0]?.date, b=r.days[r.days.length-1]?.date;
    h+=`<div class="rhead" style="--rc:${r.color}"><div class="em">${r.emoji}</div><div><div class="n">${esc(r.name)}</div><div class="d">${a?fmt(a,{day:"numeric",month:"short"})+" – "+fmt(b,{day:"numeric",month:"short"})+" · "+r.days.length+" days":""}</div></div></div>`;
    return h+(r.days.length?r.days.map(d=>dayCard(r,d)).join(""):`<div class="empty">No days found in this tab.</div>`);
  },
  flights(){
    const t=today(); const up=DATA.flights.filter(f=>!(f.date&&f.date<t)), past=DATA.flights.filter(f=>f.date&&f.date<t);
    return (up.length?sec("Upcoming",up.length+" flights")+up.map(flightCard).join(""):"")+(past.length?sec("Done")+past.map(flightCard).join(""):"");
  },
  cars(){
    if(!DATA.cars.length) return `<div class="empty">No car info found.</div>`;
    const col={Calafate:"#3b7aa3",Bariloche:"#3f7a4c",Salta:"#c2562f"};
    return sec("Rental options","from the sheet")+DATA.cars.map(g=>{const c=Object.entries(col).find(([k])=>g.name.includes(k))?.[1]||"#16303f";
      return `<div class="card"><div class="simple" style="margin-bottom:6px"><div class="dbadge" style="--rc:${c};width:auto;padding:6px 10px"><b style="font-size:15px">🚗 ${esc(g.name)}</b></div><span class="muted small">${esc(g.days)}</span></div>
      ${g.info.map(i=>`<div class="small muted">${esc(i)}</div>`).join("")}
      <div style="margin-top:6px">${g.opts.map(o=>`<div class="co"><div class="row"><div><b>${esc(o.car)}</b>${o.cls?`<div class="small muted">${esc(o.cls)}</div>`:""}</div><div class="price">${esc(o.total)}</div></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${o.co?`<span class="pill">${esc(o.co)}</span>`:""}${o.gear?`<span class="pill">${esc(o.gear)}</span>`:""}${o.note?`<span class="pill hot">${esc(o.note)}</span>`:""}${o.extra?`<span class="pill hot">${esc(o.extra.trim())}</span>`:""}</div></div>`).join("")}</div></div>`;}).join("");
  },
  pack(){
    const L=DATA.checklist, done=L.filter(i=>i.done).length, pct=L.length?done/L.length:0, C=2*Math.PI*26;
    const cats={}; L.forEach(i=>(cats[i.cat]??=[]).push(i));
    let h=`<div class="card ring" style="margin-top:8px"><svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--chip)" stroke-width="7"/><circle cx="32" cy="32" r="26" fill="none" stroke="var(--ok)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)">${Math.round(pct*100)}%</text></svg>
      <div><b style="font-size:18px">${done} of ${L.length} packed</b><div class="small muted">${L.length-done} left · tick items in the sheet</div></div></div>`;
    for(const [c,items] of Object.entries(cats)){ const left=items.filter(i=>!i.done).length;
      h+=sec(esc(c),left?left+" left":"all done ✓")+`<div class="card"><ul class="pk">${items.sort((a,b)=>a.done-b.done).map(i=>`<li class="${i.done?"done":""}"><div class="box ${i.done?"y":""}">${i.done?"✓":""}</div><div style="flex:1"><div class="w">${esc(i.item)}${i.qty&&i.qty!=="1"?` <span class="muted">× ${esc(i.qty)}</span>`:""}</div>${i.notes?`<div class="small muted">${esc(i.notes)}</div>`:""}</div></li>`).join("")}</ul></div>`; }
    return h;
  },
  search(){
    const q=HL.toLowerCase(); let h="", n=0;
    const fl=DATA.flights.filter(f=>[f.fromCity,f.toCity,f.no,f.code,f.fromAp,f.toAp].join(" ").toLowerCase().includes(q));
    if(fl.length) h+=sec("Flights")+fl.map(flightCard).join("");
    let p="";
    for(const r of DATA.regions) for(const d of r.days){
      if([r.name,d.title,d.route,...d.items.map(i=>i.what+" "+i.note),...d.notes].join(" ").toLowerCase().includes(q)){ p+=dayCard(r,d); n++; } }
    if(n) h+=sec("Plan",n+" day"+(n>1?"s":""))+p;
    return h||`<div class="empty">Nothing found for “${esc(HL)}”.</div>`;
  }
};
function render(){
  if(!DATA) return;
  document.getElementById("view").innerHTML=V[HL?"search":VIEW]();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",!HL&&b.dataset.v===VIEW));
}
function goto(k){ VIEW="plan"; REGION=null; HL=""; render(); const el=document.getElementById("d-"+k);
  if(el){ const y=el.getBoundingClientRect().top+scrollY-document.getElementById("hdr").offsetHeight-8; scrollTo({top:y,behavior:"smooth"}); } }

// ---------- events ----------
document.getElementById("nav").onclick=e=>{const b=e.target.closest("button"); if(!b) return;
  VIEW=b.dataset.v; HL=""; document.getElementById("search").value=""; document.getElementById("searchWrap").style.display="none";
  try{localStorage.setItem("trip-view",VIEW);}catch(_){}
  render(); scrollTo(0,0);
  if(VIEW==="plan"&&REGION==null){ const s=document.querySelector(".sd.now"); s&&s.scrollIntoView({inline:"center",block:"nearest"}); } };
document.getElementById("view").onclick=e=>{
  const c=e.target.closest("[data-r]"); if(c){ REGION=c.dataset.r===""?null:+c.dataset.r; render(); scrollTo(0,0); return; }
  const g=e.target.closest("[data-goto]"); if(g){ goto(g.dataset.goto); return; }
  const cp=e.target.closest("[data-copy]"); if(cp){ navigator.clipboard?.writeText(cp.dataset.copy).then(()=>{const t=cp.textContent; cp.textContent="Copied ✓"; setTimeout(()=>cp.textContent=t,1200);}); }
};
document.getElementById("btnSearch").onclick=()=>{const w=document.getElementById("searchWrap"),s=document.getElementById("search");
  const show=w.style.display!=="block"; w.style.display=show?"block":"none"; if(show) s.focus(); else { s.value=""; HL=""; render(); } };
document.getElementById("search").oninput=e=>{ HL=e.target.value.trim(); render(); };
document.getElementById("btnRefresh").onclick=refresh;
addEventListener("scroll",()=>document.getElementById("hdr").classList.toggle("scrolled",scrollY>4),{passive:true});
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&DATA&&Date.now()-DATA.at>10*60000) refresh(); });
setInterval(setStatus,60000);

// ---------- unlock & start ----------
function start(){
  document.getElementById("lock").style.display="none";
  try{ VIEW=localStorage.getItem("trip-view")||"today"; }catch(_){}
  const c=loadCached(); if(c){ DATA=build(c); setStatus(); render(); }
  refresh();
}
async function tryUnlock(raw){ SHEET=await decryptSheet(raw); return SHEET; }
(async()=>{
  if(!LOCKED){ document.getElementById("view").innerHTML=`<div class="empty">Not configured.</div>`; return; }
  try{ const k=localStorage.getItem(KEY_KEY); if(k){ await tryUnlock(b64d(k)); return start(); } }catch(_){}
  const L=document.getElementById("lock"); L.style.display="flex";
  const go=async()=>{ const p=document.getElementById("pass").value.trim(); if(!p) return;
    document.getElementById("err").textContent="Checking…";
    try{ const raw=await deriveKey(p); await tryUnlock(raw); try{localStorage.setItem(KEY_KEY,b64e(raw));}catch(_){} start(); }
    catch(_){ document.getElementById("err").textContent="Wrong passcode, try again"; } };
  document.getElementById("unlock").onclick=go;
  document.getElementById("pass").onkeydown=e=>{ if(e.key==="Enter") go(); };
})();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
